name: AUR release

# Every push to `main` that comes from a PR labelled release:patch,
# release:minor or release:major releases a new version to the AUR: the last
# version tag (e.g. 2.1.0) is bumped accordingly, the commit is tagged with
# the result, and aur/PKGBUILD is filled in and pushed with a fresh .SRCINFO to
# the AUR repository. Pushes without such a label only run the CI.
#
# Needs the AUR_SSH_PRIVATE_KEY secret: the private SSH key whose public key is
# set on the AUR account that maintains the package. The outcome of a release
# (or a failure of this workflow) is posted to Discord via DISCORD_WEBHOOK.
on:
  push:
    branches: [main]

# Never two releases at once; a newer push waits instead of cancelling
concurrency:
  group: aur-release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    container: archlinux:latest
    permissions:
      contents: write # pushing the version tag
      pull-requests: read # the labels of the merged PR
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.pkgver }}
    env:
      AUR_REPO: ssh://aur@aur.archlinux.org/email-client.git
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel git openssh sudo jq

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags, to find the last version

      - name: Set up SSH for the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "::error::The AUR_SSH_PRIVATE_KEY secret is not set"; exit 1; }
          # Explicit paths: in a container job HOME is not the home directory ssh uses
          install -dm700 /etc/aur-ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /etc/aur-ssh/key
          chmod 600 /etc/aur-ssh/key
          # Pinned host key (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as on the Arch wiki)
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > /etc/aur-ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -F /dev/null -i /etc/aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/aur-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          git config --global --add safe.directory '*'

      - name: Decide what to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          git clone "$AUR_REPO" aur-repo
          aur=""
          [ -f aur-repo/.SRCINFO ] && aur=$(sed -n 's/^\tpkgver = //p' aur-repo/.SRCINFO)

          out() {
            { echo "pkgver=$1"; echo "publish=$2"; echo "tag_exists=$3"; } >> "$GITHUB_OUTPUT"
          }

          # A re-run of a release that already tagged this commit keeps its version
          pkgver=$(git tag --points-at "$GITHUB_SHA" | grep -E "$semver" | sort -V | tail -1 || true)
          if [ -n "$pkgver" ]; then
            tag_exists=true
            echo "This commit is already tagged $pkgver"
          else
            tag_exists=false
            labels=$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              | jq -r '.[0].labels[]?.name')
            bump=""
            for level in patch minor major; do # the biggest one wins
              grep -qx "release:$level" <<< "$labels" && bump=$level
            done
            if [ -z "$bump" ]; then
              echo "::notice::No release:patch/minor/major label on the merged PR, nothing to release"
              out "" false false
              exit 0
            fi

            last=$(git tag -l | grep -E "$semver" | sort -V | tail -1 || true)
            last=${last:-0.0.0}
            # In case a newer version was published to the AUR by hand
            if [[ "$aur" =~ $semver ]] && [ "$(vercmp "$aur" "$last")" -gt 0 ]; then
              last=$aur
            fi
            IFS=. read -r major minor patch <<< "$last"
            case $bump in
              major) pkgver="$((major + 1)).0.0" ;;
              minor) pkgver="$major.$((minor + 1)).0" ;;
              patch) pkgver="$major.$minor.$((patch + 1))" ;;
            esac
            echo "release:$bump label: $last -> $pkgver"
          fi

          if [ "$aur" = "$pkgver" ]; then
            echo "::notice::$pkgver is already on the AUR"
            out "$pkgver" false "$tag_exists"
          else
            out "$pkgver" true "$tag_exists"
          fi

      # Build the package from a local copy of the source before tagging, so a
      # broken package leaves neither a tag nor an AUR update behind
      - name: Test build of the package
        if: steps.version.outputs.publish == 'true'
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          install -d -o builder /home/builder/pkg
          git archive --prefix="Email-Client-$PKGVER/" -o "/home/builder/pkg/email-client-$PKGVER.tar.gz" HEAD
          sed -e "s/^pkgver=.*/pkgver=$PKGVER/" \
              -e 's|^source=.*|source=("${pkgname}-${pkgver}.tar.gz")|' \
              aur/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder/pkg

          # vmime is an AUR dependency, so pacman cannot install it
          sudo -u builder bash -euo pipefail -c '
            cd ~
            git clone https://aur.archlinux.org/vmime.git
            # A split package: vmime and vmime-libonly conflict, so install only vmime
            (cd vmime && makepkg -s --noconfirm &&
              sudo pacman -U --noconfirm "$(makepkg --packagelist | grep "/vmime-[0-9]")")
            cd pkg && makepkg -si --noconfirm
          '
          # Every library must come from an installed package, not from the build tree
          if ldd /usr/bin/email_client | grep -E 'not found|/home/'; then
            echo "::error::The packaged email_client is missing libraries"; exit 1
          fi

      - name: Tag the release
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.tag_exists == 'false'
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          git tag "$PKGVER" "$GITHUB_SHA"
          git push origin "refs/tags/$PKGVER"

      - name: Publish to the AUR
        if: steps.version.outputs.publish == 'true'
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          url="https://github.com/Student-Team-Projects/Email-Client/archive/refs/tags/$PKGVER.tar.gz"
          sum=$(curl -fsSL --retry 5 --retry-all-errors "$url" | sha256sum | cut -d' ' -f1)

          sed -e "s/^pkgver=.*/pkgver=$PKGVER/" \
              -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
              aur/PKGBUILD > aur-repo/PKGBUILD
          # makepkg refuses to run as root
          install -d -o builder /home/builder/srcinfo
          cp aur-repo/PKGBUILD /home/builder/srcinfo/
          (cd /home/builder/srcinfo && sudo -u builder makepkg --printsrcinfo) > aur-repo/.SRCINFO

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $PKGVER" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push origin HEAD:master

  # One message per release attempt: success when a new version reached the
  # AUR, failure when the CI or the release broke. Nothing when there was
  # nothing new to release.
  notify:
    needs: [ci, release]
    if: >-
      always() && (needs.release.outputs.publish == 'true'
        || contains(fromJSON('["failure", "cancelled"]'), needs.ci.result)
        || contains(fromJSON('["failure", "cancelled"]'), needs.release.result))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CI_RESULT: ${{ needs.ci.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK secret is not set, skipping"
            exit 0
          fi

          if [ "$CI_RESULT" = success ] && [ "$RELEASE_RESULT" = success ]; then
            payload=$(jq -n --arg version "$VERSION" --arg run "$RUN_URL" '{
              username: "Release Alarm 📦",
              allowed_mentions: { parse: [] },
              content: "🚨🚨🎉🎊 **NOWA WERSJA W AUR!** 🎊🎉🚨🚨\n📦✨🥳🍾 Release poszedł! 🍾🥳✨📦",
              embeds: [{
                title: ("email-client " + $version),
                url: "https://aur.archlinux.org/packages/email-client",
                color: 3066993,
                description: "🎊🚀 Gotowe do instalacji: `yay -S email-client` 🔥✨🎉",
                fields: [
                  { name: "🔧 Workflow", value: ("[logi](" + $run + ")"), inline: true }
                ]
              }]
            }')
          else
            if [ "$CI_RESULT" != success ]; then
              stage="CI"
            else
              stage="Release"
            fi
            payload=$(jq -n --arg stage "$stage" --arg run "$RUN_URL" \
                --arg commit "$COMMIT_URL" --arg sha "${SHORT_SHA:0:7}" --arg version "$VERSION" '{
              username: "Release Alarm 📦",
              allowed_mentions: { parse: [] },
              content: (if $stage == "CI" then "🚨❌🚨 **CI NA MAIN NIE PRZESZŁO** 🚨❌🚨" else "🚨❌🚨 **RELEASE DO AUR NIE POSZEDŁ** 🚨❌🚨" end),
              embeds: [{
                title: ("Padło na etapie: " + $stage),
                url: $run,
                color: 15158332,
                description: "🧯 AUR bez zmian. Szczegóły w logach workflow 👆🔍",
                fields: ([
                  { name: "📌 Commit", value: ("[`" + $sha + "`](" + $commit + ")"), inline: true }
                ] + (if $version != "-" and $version != "" then
                  [{ name: "📦 Wersja", value: $version, inline: true }] else [] end))
              }]
            }')
          fi

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK"
